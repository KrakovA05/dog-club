name: Business Report

on:
  schedule:
    # 17:47 UTC = 20:47 МСК (некруглое время — меньше задержки очереди GitHub)
    - cron: "47 17 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send business report
        run: |
          curl -s -X GET \
            -H "x-report-secret: ${{ secrets.REPORT_SECRET }}" \
            https://lapaclub.ru/api/admin/business-report

name: Business Report

on:
  schedule:
    # 15:28 UTC = 18:28 МСК. Запускаем сильно раньше: GitHub задерживает
    # scheduled-воркфлоу на 1–3 часа, чтобы отчёт приходил к ~21:00.
    - cron: "28 15 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send business report
        run: |
          # Amvera иногда моргает на запуске — даём 3 попытки с паузой.
          # Падаем с ошибкой, если отчёт реально не ушёл (curl -s раньше
          # глотал ответ → сбой выглядел как успех).
          for i in 1 2 3; do
            code=$(curl -s --max-time 30 -o /tmp/resp.txt -w "%{http_code}" \
              -H "x-report-secret: ${{ secrets.REPORT_SECRET }}" \
              https://lapaclub.ru/api/admin/business-report)
            echo "Попытка $i: HTTP $code — $(cat /tmp/resp.txt)"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/resp.txt; then
              echo "Отчёт отправлен."
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 60
          done
          echo "Отчёт НЕ отправлен после 3 попыток."
          exit 1

name: Tech Evening Report

on:
  schedule:
    # 15:31 UTC = 18:31 МСК. Запускаем сильно раньше: GitHub задерживает
    # scheduled-воркфлоу на 1–3 часа, чтобы отчёт приходил к ~21:00.
    - cron: "31 15 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send tech evening report
        run: |
          curl -s -X GET \
            -H "x-report-secret: ${{ secrets.REPORT_SECRET }}" \
            "https://lapaclub.ru/api/admin/daily-report?today=1"
